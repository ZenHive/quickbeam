scored_at = "2026-06-18"
depends_on = [1, 2, 12]
body = "WASM_ENABLE_LIBC_WASI=1 aktivieren (native.ex + wamr.zig). args, env und preopen-Verzeichnisse durch wamr_bridge.c und wasm_nif.zig plumben und in der nativen Elixir-API exponieren: QuickBEAM.WASM.start(module: ..., wasi: [args: [...], env: %{...}, preopen: [{guest, host}]]). Safe-by-default: KEIN Filesystem-Zugriff ohne explizit gewaehrten preopen (Capability-Sandbox); stdout/stderr abfangbar nach Elixir. Test mit einem echten WASI-Modul (TinyGo oder Rust wasm32-wasi)."
acceptance_criteria = [
  "Ein von TinyGo/Rust kompiliertes WASI-hello-world laeuft und sein stdout wird nach Elixir gecaptured",
  "Kein Datei-/Verzeichniszugriff moeglich ohne expliziten preopen-Eintrag",
  "args + env werden ans Modul durchgereicht",
  "Instruction-Metering funktioniert weiter unter WASI",
  "Flag in native.ex UND wamr.zig gesetzt"
]
out_of_scope = ["WASI-preview2 / Component Model (nur preview1)", "Netzwerk-Sockets"]

[[task]]
id = 4
phase = 2
bundle = "toolchain"
milestone = "v0_1"
status = "pending"
title = "SIMD-Opcodes aktivieren"
scores = { d = 3, b = 6, u = 6 }
created_at = "2026-06-18"
scored_at = "2026-06-18"
depends_on = [1, 2, 12]
body = "WASM_ENABLE_SIMD=1 in native.ex und wamr.zig. Rust-Release-Builds und manche Emscripten-Outputs emittieren v128-SIMD; ohne dies scheitert deren Instanziierung. RISIKO ZUERST DE-RISKEN: wir laufen den Classic Interpreter (FAST_INTERP=0, AOT=0, JIT=0) — historisch der schwaechste SIMD-Pfad in WAMR (v128 war zuerst nur in AOT/Fast-Interp robust). Vor dem Impl-Scope verifizieren, ob Classic-Interp-SIMD die noetigen v128-Opcodes ueberhaupt voll deckt; ergibt das eine Luecke, wird Task 4 zum Spike (Decision-Doc + ggf. Pfadwechsel) statt eines reinen Flag-Flips, und d steigt. Test mit einem SIMD-nutzenden Modul; Konformanz-Subset simd aus Task 2 gruen."
acceptance_criteria = [
  "Vorab verifiziert: Classic-Interp deckt die noetigen v128-Opcodes (sonst als Spike umscoped)",
  "v128-SIMD-Modul instanziiert und rechnet korrekt",
  "Spec-Konformanz-Subset simd (Task 2) gruen",
  "Flag in native.ex UND wamr.zig gesetzt",
  "Binary-Size-Delta dokumentiert"
]

