[[task]]
id = 12
phase = 1
bundle = "foundation"
milestone = "v0_1"
status = "pending"
title = "WASM_ENABLE_*-Flags aus einer Quelle generieren + Drift-Guard"
scores = { d = 4, b = 7, u = 8 }
depends_on = [1]
acceptance_criteria = ["Das WASM_ENABLE_*-Set ist nur noch an EINER Stelle hand-gepflegt; die andere wird daraus abgeleitet", "Ein Guard (Test oder Compile-Assert) schlaegt fehl, wenn native.ex- und wamr.zig-Flags divergieren", "Eine Flag-Aenderung erfordert nur noch eine Edit-Stelle (an Task 3/4/5 verifizierbar)", "Alle bestehenden WASM-Tests bleiben gruen"]
files_to_modify = ["lib/quickbeam/native.ex", "lib/quickbeam/wamr.zig"]
touches = ["lib/quickbeam/native.ex", "lib/quickbeam/wamr.zig", "test/wasm_test.exs"]
body = "Das WASM_ENABLE_*-Feature-Set existiert doppelt und hand-gepflegt: native.ex @wamr_base_cflags (kompiliert WAMRs .c) und wamr.zig @cDefine (kompiliert das Zig-Glue / @cImport der WAMR-Header). Beide MUESSEN uebereinstimmen, weil WAMR-Structs konditional auf diese Makros kompiliert werden — eine Divergenz ist ein stiller Memory-Layout-/ODR-Bug, kein Compile-Fehler (Task 1 belegt, dass sie schon gedriftet sind: BULK_MEMORY_OPT). Die zwei Kopien zu einer Quelle machen: das @cDefine-Set aus native.ex generieren ODER beide aus einer gemeinsamen Liste ableiten, sodass jede kuenftige Flag-Aenderung (Tasks 3/4/5) genau EINE Stelle anfasst. Zusaetzlich ein Guard, der die zwei Sets bei Build/Test auf Gleichheit prueft (Compile-Time-Assert oder Test), damit eine Drift als CI-Failure auftaucht und nicht erst beim Consumer als Speicherkorruption."
created_at = "2026-06-18"
scored_at = "2026-06-18"

